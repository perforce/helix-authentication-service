---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-svc
  namespace: helix
data:
  DEBUG: '1'
  CLIENT_CERT_HEADER: ssl-client-cert
  # SHA-256 fingerprint of the client certificate used by the P4 Server
  # extension; replace with the fingerprint of your own certificate, e.g.
  # openssl x509 -in client.crt -noout -fingerprint -sha256
  CLIENT_CERT_FP: 'REPLACE_WITH_YOUR_CLIENT_CERT_SHA256_FINGERPRINT'
  # OIDC_CLIENT_ID and OIDC_CLIENT_SECRET are configured in the deployment
  OIDC_ISSUER_URI: https://login.microsoftonline.com/example-tenant-id/v2.0
  OIDC_INFO_LABEL: 'Azure OIDC'
  PORT: '3000'
  PROTOCOL: http
  REDIS_URL: 'redis://redis.helix:6379'
  SAML_IDP_METADATA_URL: https://login.microsoftonline.com/example-tenant-id/federationmetadata/2007-06/federationmetadata.xml?appid=example-app-id
  SAML_SP_ENTITY_ID: https://auth-svc.pcloud
  SAML_INFO_LABEL: 'Azure SAML'
  SVC_BASE_URI: https://auth-svc.pcloud
  TRUST_PROXY: 'true'
...
